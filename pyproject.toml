[project]
name = "ai-data-protection-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kartik Sharma", email = "kartik.sharma@ditstek.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.141.1",
    "presidio-analyzer>=2.2.364",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-data-protection-agent = "ai_data_protection_agent:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
]
